<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔱 Oraciones a Maha Kali — La Negra, Destructora del Ego</title>
<style>
  :root {
    --red: #ff2d55;
    --red-soft: #ff7a93;
    --red-deep: #b3123a;
    --blood: #8e0e2e;
    --fire: #ff7a1a;
    --ember: #ffb347;
    --night: #0b0614;
    --night2: #160a24;
    --silver: #efeaf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 20%, #2a0a2e 0%, var(--night2) 45%, var(--night) 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    color: var(--silver);
  }

  /* ── Fondo: aura roja pulsante ── */
  .aura {
    position: fixed;
    width: 640px; height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,85,.18) 0%, rgba(255,122,26,.07) 40%, transparent 70%);
    animation: pulseAura 4.5s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
  }
  @keyframes pulseAura {
    0%, 100% { transform: scale(1); opacity: .8; }
    50%      { transform: scale(1.14); opacity: 1; }
  }

  /* ── Fuego base: fueguitos parpadeando abajo ── */
  .bonfire {
    position: fixed;
    bottom: -8px;
    font-size: 34px;
    pointer-events: none;
    z-index: 1;
    opacity: .85;
    filter: drop-shadow(0 0 12px rgba(255,122,26,.7));
    animation: bonflick 1.1s ease-in-out infinite;
    user-select: none;
  }
  @keyframes bonflick {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    30%      { transform: scaleY(1.18) scaleX(.94); }
    60%      { transform: scaleY(.92) scaleX(1.06); }
  }

  /* ── Elementos flotantes: ॐ, hamsa, lenguas, fuego, devanagari ── */
  .float-item {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    user-select: none;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,45,85,.3));
  }
  .float-item > span { display: inline-block; }
  @keyframes floatUp {
    0%   { transform: translateY(108vh) rotate(-12deg); opacity: 0; }
    10%  { opacity: .95; }
    88%  { opacity: .75; }
    100% { transform: translateY(-18vh) rotate(14deg); opacity: 0; }
  }
  .flick > span { animation: flick .8s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes flick {
    0%, 100% { transform: scale(1); }
    40%      { transform: scale(1.25, 1.35); }
    70%      { transform: scale(.9, .85); }
  }
  .wiggle > span { animation: wiggle 1.4s ease-in-out infinite; transform-origin: 50% 0%; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-14deg) scaleY(1); }
    50%      { transform: rotate(14deg) scaleY(1.15); }
  }
  .sway > span { animation: sway 3s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg) translateY(-3px); }
  }

  /* ── Brasas subiendo ── */
  .ember {
    position: fixed;
    bottom: -6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(circle, var(--ember) 0%, var(--fire) 55%, transparent 75%);
    box-shadow: 0 0 10px 3px rgba(255,122,26,.55);
    animation: riseEmber linear infinite;
  }
  @keyframes riseEmber {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    8%   { opacity: 1; }
    100% { transform: translateY(-108vh) translateX(6vw) scale(.3); opacity: 0; }
  }

  /* ── Tarjeta principal ── */
  .container {
    position: relative;
    z-index: 2;
    width: 92%;
    max-width: 640px;
    height: 86vh;
    background: rgba(11, 6, 20, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 45, 85, 0.32);
    border-radius: 22px;
    box-shadow: 0 0 46px rgba(255,45,85,.16), 0 20px 60px rgba(0,0,0,.6);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    animation: appear .8s ease both;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  header { text-align: center; margin-bottom: 10px; }
  .kali-face {
    width: 92px;
    height: 92px;
    display: inline-block;
    filter: drop-shadow(0 0 16px rgba(255,45,85,.55));
    animation: kaliGlow 3s ease-in-out infinite;
  }
  @keyframes kaliGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(255,45,85,.45)); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 24px rgba(255,45,85,.85)); transform: scale(1.04); }
  }
  .kali-tongue { animation: svgTongue 1.6s ease-in-out infinite; transform-origin: 50px 62px; }
  @keyframes svgTongue {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.18); }
  }
  h1 {
    font-size: 26px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--silver), var(--red-soft), var(--fire));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255,45,85,.25);
    margin-top: 4px;
  }
  .subtitle {
    font-size: 12.5px;
    color: rgba(239,234,246,.65);
    font-style: italic;
    margin-top: 4px;
    letter-spacing: .5px;
  }
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 10px 0 12px;
    font-size: 13px;
    color: rgba(255,45,85,.8);
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,45,85,.55), transparent);
  }
  .divider span { animation: sway 3s ease-in-out infinite; display: inline-block; }

  .input-field {
    padding: 12px 16px;
    border: 1px solid rgba(255,45,85,.38);
    border-radius: 12px;
    margin-bottom: 12px;
    font-size: 15px;
    background: rgba(11,6,20,.6);
    color: var(--silver);
    outline: none;
    transition: border-color .3s, box-shadow .3s;
  }
  .input-field:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,45,85,.18), 0 0 18px rgba(255,45,85,.3);
  }
  .input-field::placeholder { color: rgba(239,234,246,.4); }

  #chatBox {
    flex: 1;
    overflow-y: auto;
    border: 1px solid rgba(255,45,85,.22);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    background: rgba(11,6,20,.5);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,45,85,.45) transparent;
  }
  #chatBox::-webkit-scrollbar { width: 6px; }
  #chatBox::-webkit-scrollbar-thumb { background: rgba(255,45,85,.45); border-radius: 3px; }

  .msg {
    margin-bottom: 16px;
    line-height: 1.7;
    animation: slideIn .4s ease both;
    max-width: 88%;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    margin-left: auto;
    text-align: right;
    background: linear-gradient(135deg, rgba(255,45,85,.28), rgba(255,122,26,.16));
    border: 1px solid rgba(255,45,85,.4);
    padding: 10px 16px;
    border-radius: 16px 16px 4px 16px;
    color: var(--red-soft);
    font-weight: 600;
  }
  .msg.bot {
    background: rgba(239,234,246,.06);
    border: 1px solid rgba(239,234,246,.12);
    padding: 14px 18px;
    border-radius: 4px 16px 16px 16px;
    color: var(--silver);
  }
  .msg.bot strong { color: var(--red-soft); }
  .msg.error { color: #ff9b9b; border: 1px solid rgba(255,123,123,.4); background: rgba(255,60,60,.08); }

  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing span {
    width: 7px; height: 7px;
    background: var(--red);
    border-radius: 50%;
    animation: bounceDot 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounceDot {
    0%, 100% { transform: translateY(0); opacity: .5; }
    50%      { transform: translateY(-6px); opacity: 1; }
  }

  button {
    padding: 14px;
    background: linear-gradient(135deg, var(--red), var(--red-deep));
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .5px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform .2s, box-shadow .3s;
    box-shadow: 0 4px 18px rgba(255,45,85,.4);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(255,45,85,.55); }
  button:active { transform: translateY(0); }
  button::after {
    content: '';
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 60% { left: -80%; }
    100%    { left: 130%; }
  }
  button:disabled { opacity: .6; cursor: wait; transform: none; }

  .footer-mantra {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    color: rgba(255,122,147,.85);
    letter-spacing: 2px;
    animation: glowText 3s ease-in-out infinite;
  }
  @keyframes glowText {
    0%, 100% { text-shadow: 0 0 6px rgba(255,45,85,.3); }
    50%      { text-shadow: 0 0 20px rgba(255,45,85,.9); }
  }
</style>
</head>
<body>

<div class="aura" id="aura"></div>

<div class="container">
  <header>
    <!-- Rostro estilizado de Maha Kali: corona, tercer ojo y lengua -->
    <svg class="kali-face" viewBox="0 0 100 100" aria-label="Maha Kali">
      <!-- cabellera -->
      <path d="M8 22 Q50 -12 92 22 Q98 50 90 62 L10 62 Q2 50 8 22Z" fill="#14091f"/>
      <!-- cara azul-negro -->
      <ellipse cx="50" cy="48" rx="29" ry="26" fill="#1b2a4a"/>
      <ellipse cx="50" cy="48" rx="29" ry="26" fill="url(#faceShade)"/>
      <defs>
        <radialGradient id="faceShade" cx="50%" cy="35%" r="75%">
          <stop offset="0%" stop-color="#2a3f6b"/>
          <stop offset="100%" stop-color="#101a30"/>
        </radialGradient>
      </defs>
      <!-- corona dorada -->
      <path d="M28 30 L34 8 L42 22 L50 4 L58 22 L66 8 L72 30 Q50 20 28 30Z" fill="#f5c14e"/>
      <circle cx="50" cy="13" r="2.4" fill="#ff2d55"/>
      <!-- tercer ojo -->
      <ellipse cx="50" cy="33" rx="3" ry="4.6" fill="#ff2d55"/>
      <ellipse cx="50" cy="33" rx="1.2" ry="2.4" fill="#ffd6de"/>
      <!-- cejas fieras -->
      <path d="M32 38 L46 42" stroke="#0a050f" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M68 38 L54 42" stroke="#0a050f" stroke-width="2.6" stroke-linecap="round"/>
      <!-- ojos blancos -->
      <ellipse cx="41" cy="45" rx="5.4" ry="3.6" fill="#ffffff"/>
      <circle cx="41.5" cy="45" r="1.9" fill="#0a050f"/>
      <ellipse cx="59" cy="45" rx="5.4" ry="3.6" fill="#ffffff"/>
      <circle cx="58.5" cy="45" r="1.9" fill="#0a050f"/>
      <!-- nariz -->
      <path d="M50 47 L48.5 53 L51.5 53" stroke="#0d1830" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- boca sonriente con colmillos -->
      <path d="M40 57 Q50 64 60 57 Q50 61 40 57Z" fill="#5c0a18"/>
      <path d="M43 58 L45 62 L47 58.5Z" fill="#ffffff"/>
      <path d="M57 58 L55 62 L53 58.5Z" fill="#ffffff"/>
      <!-- lengua roja fuera -->
      <path class="kali-tongue" d="M44 60 Q46 82 50 84 Q54 82 56 60 Q50 64 44 60Z" fill="#ff3355"/>
      <path class="kali-tongue" d="M50 66 L50 80" stroke="#c81e40" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    <h1>Oraciones a Maha Kali</h1>
    <p class="subtitle">Mahakali · Diosa del Tiempo y la Transformación · Destructora del Ego</p>
  </header>

  <div class="divider"><span>🔱</span><span>🪬</span><span>👅</span><span>🔥</span><span>🪬</span><span>🔱</span></div>

  <input type="password" class="input-field" id="apiKeyInput" placeholder="🔑 Ingresa tu API Key de Groq">
  <div id="chatBox"></div>
  <input type="text" class="input-field" id="userInput" placeholder="🔥 ¿Qué deseas ofrecer a Kali?" onkeydown="if(event.key==='Enter')enviar()">
  <button id="btnEnviar" onclick="enviar()">⚔️ Enviar Petición</button>
  <p class="footer-mantra">॥ ॐ क्रीं कालिकायै नमः ॥</p>
</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const btnEnviar = document.getElementById('btnEnviar');

  function crearFlotantes() {
    const items = [
      { txt: 'ॐ', cls: 'sway' },
      { txt: 'क्रीं', cls: 'sway' },
      { txt: 'काली', cls: 'sway' },
      { txt: 'लीं', cls: 'sway' },
      { txt: '🪬', cls: 'sway' },
      { txt: '👅', cls: 'wiggle' },
      { txt: '🔥', cls: 'flick' },
      { txt: '🔱', cls: 'sway' }
    ];
    for (let i = 0; i < 16; i++) {
      const it = items[Math.floor(Math.random() * items.length)];
      const el = document.createElement('div');
      el.className = 'float-item ' + it.cls;
      el.innerHTML = '<span>' + it.txt + '</span>';
      el.style.left = Math.random() * 100 + 'vw';
      const isDevanagari = it.txt.length > 1 || /[\u0900-\u097F]/.test(it.txt);
      el.style.fontSize = (isDevanagari ? 26 : 24) + Math.random() * 26 + 'px';
      el.style.color = it.txt === 'ॐ' || it.txt === 'क्रीं' || it.txt === 'काली' || it.txt === 'लीं'
        ? 'rgba(255,122,147,' + (0.25 + Math.random() * 0.3) + ')' : '';
      const dur = 15 + Math.random() * 18;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = -(Math.random() * dur) + 's';
      document.body.appendChild(el);
    }
  }

  function crearBrasas() {
    for (let i = 0; i < 26; i++) {
      const e = document.createElement('div');
      e.className = 'ember';
      e.style.left = Math.random() * 100 + 'vw';
      const size = 3 + Math.random() * 5;
      e.style.width = e.style.height = size + 'px';
      const dur = 5 + Math.random() * 7;
      e.style.animationDuration = dur + 's';
      e.style.animationDelay = -(Math.random() * dur) + 's';
      document.body.appendChild(e);
    }
  }

  function crearFueguitos() {
    const n = Math.max(4, Math.floor(window.innerWidth / 170));
    for (let i = 0; i < n; i++) {
      const f = document.createElement('div');
      f.className = 'bonfire';
      f.textContent = '🔥';
      f.style.left = (i * (100 / n) + Math.random() * 6) + 'vw';
      f.style.fontSize = (26 + Math.random() * 22) + 'px';
      f.style.animationDelay = -(Math.random() * 1.2) + 's';
      f.style.animationDuration = (0.9 + Math.random() * 0.5) + 's';
      document.body.appendChild(f);
    }
  }

  crearFlotantes();
  crearBrasas();
  crearFueguitos();

  function centrarAura() {
    const a = document.getElementById('aura');
    a.style.left = (window.innerWidth / 2 - 320) + 'px';
    a.style.top = (window.innerHeight / 2 - 320) + 'px';
  }
  centrarAura();
  window.addEventListener('resize', centrarAura);

  function formatearRespuesta(texto) {
    const esc = texto.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return esc
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  function mostrarEscritura() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typingMsg';
    div.innerHTML = '<span class="typing"><span></span><span></span><span></span></span> Kali escucha tu petición...';
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function enviar() {
    const apiKey = apiKeyInput.value.trim();
    const mensaje = userInput.value.trim();
    if (!apiKey || !mensaje) return alert('Por favor, ingresa tu API Key y tu petición.');

    const divUser = document.createElement('div');
    divUser.className = 'msg user';
    divUser.textContent = mensaje;
    chatBox.appendChild(divUser);
    userInput.value = '';
    mostrarEscritura();
    btnEnviar.disabled = true;

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: "qwen/qwen3.8-27b",
          messages: [
            { role: "system", content: "Eres una guía espiritual shaktista que ayuda a los devotos a formular oraciones y mantras a Maha Kali. Basa tu sabiduría en el Devi Mahatmya, el Kalika Purana, el Kali Tantra y la tradición hindú. REGLA ABSOLUTA: NUNCA uses la palabra 'amén' o 'amen', ya que esto es hinduismo, no cristianismo. Estructura exacta obligatoria:\n\n**Oración a Maha Kali por [tema]**\n\n[Cuerpo de la oración en prosa, 150-200 palabras, tono reverente y poderoso, invocando a Kali como Diosa del Tiempo, destructora del ego y protectora de los devotos]\n\n**Om Kreem Kalikayai Namaha** 🔱🙏\n\nNo agregues texto adicional después del cierre." },
            { role: "user", content: mensaje }
          ],
          max_tokens: 350,
          temperature: 0.5
        })
      });
      const data = await res.json();
      const typingEl = document.getElementById('typingMsg');
      if (typingEl) typingEl.remove();

      // Filtro de seguridad extra para garantizar que nunca aparezca "amén"
      let respuestaSegura = data.choices[0].message.content.replace(/amén|amen/gi, "Om Shanti 🙏");
      const respuesta = formatearRespuesta(respuestaSegura);

      chatBox.innerHTML += `<div class="msg bot">${respuesta}</div>`;
    } catch (e) {
      const typingEl = document.getElementById('typingMsg');
      if (typingEl) typingEl.remove();
      chatBox.innerHTML += `<div class="msg bot error">⚠️ Error: Revisa tu API Key o tu conexión.</div>`;
    }
    btnEnviar.disabled = false;
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>
</body>
</html>
